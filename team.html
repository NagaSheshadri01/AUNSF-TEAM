<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f4f4f9; }
        iframe { width: 100%; height: 100%; border: none; }
        .error-msg { text-align: center; font-family: sans-serif; margin-top: 50px; color: #333; }
    </style>
</head>
<body>
    <iframe id="profileIframe" src=""></iframe>

    <script>
        // REPLACE THIS URL with your newly deployed Apps Script Web App URL
        const appsScriptUrl = "https://script.google.com/macros/s/AKfycbxFT1NN1yRJn0MQfKCeO-rGqnKvetLag71wgStZ0x935E5HsiovUlLymWJs6Lsw6vTU/exec";

        // Extract 'id' from the GitHub Pages URL
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('id');

        if (studentId) {
            // Append the ID and inject into the iframe
            document.getElementById('profileIframe').src = appsScriptUrl + "?id=" + encodeURIComponent(studentId);
        } else {
            // Show error if someone visits the GitHub page without an ID
            document.body.innerHTML = "<h2 class='error-msg'>Invalid QR Code: No ID provided.</h2>";
        }
    </script>
</body>
</html>
