<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Team Profiles</title>
    <style>
        /* This CSS ensures the iframe takes up the entire page seamlessly */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f4f9;
        }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }
        .error-message {
            text-align: center;
            font-family: sans-serif;
            margin-top: 40px;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- The iframe where the Google Apps Script UI will load -->
    <iframe id="appScriptFrame" src=""></iframe>

    <script>
        // 1. Get the requested team name from your website's URL (e.g., ?team=Logistics)
        const urlParams = new URLSearchParams(window.location.search);
        const teamName = urlParams.get('team');

        // 2. IMPORTANT: Paste your deployed Google Apps Script Web App URL here
        // (It should look like https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec)
        const scriptUrl = "https://script.google.com/macros/s/AKfycbwPf-57yPKggNAMOd2pmph4FM9zIiNW2QRZL0yViC1hxOZwQVHbZsiFW6TQzB7RJkk/exec";

        // 3. Inject the team parameter into the iframe source
        if (teamName) {
            document.getElementById('appScriptFrame').src = `${scriptUrl}?team=${encodeURIComponent(teamName)}`;
        } else {
            // What to show if someone visits the page without scanning a QR code
            document.body.innerHTML = "<h2 class='error-message'>No team specified. Please scan a valid team QR code.</h2>";
        }
    </script>
</body>
</html>
